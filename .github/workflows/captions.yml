name: Describe documentation images

on:
  schedule:
    # Backfills captions for images the Workers AI free quota did not cover yet
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: figma-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Starts the MCP deployment after the merge
  actions: write

jobs:
  captions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Describe images without a cached caption
        # Stays on the synced Figma versions (a new version is the sync workflow's job); their images
        # are reused, so this only reads nodes and calls Workers AI
        run: npm run sync -- --pinned
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/captions
          delete-branch: true
          commit-message: 'docs: describe documentation images'
          title: 'docs: describe documentation images'
          body: |
            Vision captions (Workers AI) for documentation images that had none yet. Captions are cached per image content in `captions.json` next to the images and rendered as `_Figure: ..._` under each image.

            - Trigger: `${{ github.event_name }}`
          labels: figma-sync

      - name: Merge pull request
        # Nobody reviews the pull request (see sync.yml); captions change no image, so there is no design review
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        run: |
          # GitHub may still be computing whether the new pull request can be merged
          for attempt in 1 2 3 4 5 6; do
            gh pr merge "$PR" --squash && break
            [ "$attempt" -lt 6 ] || exit 1
            sleep 10
          done
          # A push with the workflow token starts no workflows, so the merge does not trigger the deployment
          gh workflow run deploy-mcp.yml --ref main
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/sync/captions"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
