name: Sync Figma documentation

on:
  schedule:
    # Polls for a new named Figma version; designers publish by saving a version
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate even if the Figma version is unchanged
        type: boolean
        default: false

concurrency:
  group: figma-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Starts the design review and the MCP deployment after the merge
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Compare Figma version with frontmatter
        id: check
        continue-on-error: true
        run: npm run check
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

      - name: Fail on API errors
        if: steps.check.outcome == 'failure' && steps.check.outputs.outdated == ''
        run: exit 1

      - name: Skip when the open pull request already holds this state
        id: current
        if: steps.check.outputs.outdated == 'true' && inputs.force != true
        # Without this every run regenerates the same pull request and uses up the Workers AI quota
        run: |
          body=$(gh pr list --head sync/figma --state open --json body --jq '.[0].body // ""')
          if grep -qF "<!-- sync-key: $SYNC_KEY -->" <<<"$body"; then
            echo "The open pull request was generated from this commit and these Figma versions"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SYNC_KEY: ${{ github.sha }} ${{ steps.check.outputs.targets }}

      - name: Regenerate Markdown and images
        if: (steps.check.outputs.outdated == 'true' && steps.current.outputs.skip != 'true') || inputs.force == true
        run: npm run sync
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          # Workers AI describes new images; without these the structural fallback is used
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Open pull request
        id: pr
        if: (steps.check.outputs.outdated == 'true' && steps.current.outputs.skip != 'true') || inputs.force == true
        uses: peter-evans/create-pull-request@v7
        with:
          # One open sync PR at a time; a newer version updates the same branch
          branch: sync/figma
          delete-branch: true
          commit-message: 'docs: sync Figma documentation'
          title: 'docs: sync Figma documentation'
          body: |
            Regenerated from the latest named version of each outdated Figma file.

            - Outdated files: ${{ steps.check.outputs.summary || 'none (forced run)' }}
            - Trigger: `${{ github.event_name }}`

            Version ids and labels per document are in the frontmatter of the changed files. New or changed images were described by Workers AI (`captions.json` next to the images); images the quota did not cover carry a structural description and are picked up by the daily captions run.

            <!-- sync-key: ${{ github.sha }} ${{ steps.check.outputs.targets || 'forced' }} -->
          labels: figma-sync

      - name: Merge pull request
        # Nobody reviews the pull request; Design reviews the images on the review page after the merge.
        # No approval: the workflow token opened the pull request and GitHub does not let an author approve
        # their own pull request; main does not require one.
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        id: merge
        run: |
          # GitHub may still be computing whether the new pull request can be merged
          for attempt in 1 2 3 4 5 6; do
            gh pr merge "$PR" --squash && break
            [ "$attempt" -lt 6 ] || exit 1
            sleep 10
          done
          head=$(gh pr view "$PR" --json mergeCommit --jq .mergeCommit.oid)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$(gh api "repos/$GH_REPO/commits/$head" --jq '.parents[0].sha')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pull-request-number }}

      - name: Start design review and MCP deployment
        # A push with the workflow token starts no workflows, so the merge does not trigger them on its own
        if: steps.merge.outcome == 'success'
        run: |
          gh workflow run review.yml --ref main -f base="$BASE" -f head="$HEAD" -f pull_request="$PR"
          gh workflow run deploy-mcp.yml --ref main
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/sync/figma"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          BASE: ${{ steps.merge.outputs.base }}
          HEAD: ${{ steps.merge.outputs.head }}
