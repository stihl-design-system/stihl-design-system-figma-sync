name: Sync Figma documentation

on:
  schedule:
    # Polls for a new named Figma version; designers publish by saving a version
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate even if the Figma version is unchanged
        type: boolean
        default: false

concurrency:
  group: figma-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Compare Figma version with frontmatter
        id: check
        continue-on-error: true
        run: npm run check
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

      - name: Fail on API errors
        if: steps.check.outcome == 'failure' && steps.check.outputs.outdated == ''
        run: exit 1

      - name: Regenerate Markdown and images
        if: steps.check.outputs.outdated == 'true' || inputs.force == true
        run: npm run sync
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

      - name: Open pull request
        if: steps.check.outputs.outdated == 'true' || inputs.force == true
        uses: peter-evans/create-pull-request@v7
        with:
          # One open sync PR at a time; a newer version updates the same branch
          branch: sync/figma
          delete-branch: true
          commit-message: 'docs: sync Figma documentation'
          title: 'docs: sync Figma documentation'
          body: |
            Regenerated from the latest named version of each outdated Figma file.

            - Outdated files: ${{ steps.check.outputs.summary || 'none (forced run)' }}
            - Trigger: `${{ github.event_name }}`

            Version ids and labels per document are in the frontmatter of the changed files.
          labels: figma-sync
